<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>إدارة الإيميلات</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, sans-serif; }
  body {
    min-height: 100vh;
    background: linear-gradient(135deg, #1e1e2f, #2c2c54);
    color: #fff;
    padding: 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .top-bar { display: flex; gap: 12px; margin-bottom: 30px; flex-wrap: wrap; justify-content: center; }
  .top-bar button { padding: 14px 28px; font-size: 1rem; font-weight: bold; color: #fff; border: none; border-radius: 50px; cursor: pointer; transition: transform .15s; }
  .top-bar button:active { transform: scale(.95); }
  #addBtn { background: linear-gradient(135deg, #6a11cb, #2575fc); box-shadow: 0 0 20px rgba(101, 78, 255, .6); }
  #alertBtn { background: linear-gradient(135deg, #f7971e, #ffd200); color: #222; box-shadow: 0 0 20px rgba(255, 180, 0, .5); }
  #list { width: 100%; max-width: 550px; display: flex; flex-direction: column; gap: 15px; }
  .empty { text-align: center; opacity: .6; padding: 20px; }
  .email-row { background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.15); border-radius: 15px; padding: 15px 20px; display: flex; flex-direction: column; gap: 12px; transition: opacity .25s, transform .25s; }
  .email-text { font-size: 1.05rem; word-break: break-all; color: #e0f0ff; }
  .row-btns { display: flex; gap: 10px; }
  .copy-btn, .done-btn { flex: 1; padding: 10px; border: none; border-radius: 10px; cursor: pointer; font-weight: bold; color: #fff; font-size: .95rem; }
  .copy-btn { background: linear-gradient(135deg, #11998e, #38ef7d); }
  .done-btn { background: linear-gradient(135deg, #e53935, #b71c1c); }

  /* Modal */
  .modal-overlay {
    position: fixed; top: 0; left: 0; right: 0; bottom: 0; width: 100%; height: 100%;
    background: rgba(0,0,0,.7); display: none; justify-content: center; align-items: center;
    z-index: 9999; padding: 20px;
  }
  .modal-overlay.show { display: flex !important; }
  .modal { background: #232338; border: 1px solid rgba(255,255,255,.15); border-radius: 20px; padding: 30px; width: 100%; max-width: 420px; box-shadow: 0 10px 50px rgba(0,0,0,.6); }
  .modal h2 { margin-bottom: 18px; text-align: center; font-size: 1.2rem; }
  #emailInput { width: 100%; padding: 14px; border-radius: 12px; border: 1px solid rgba(255,255,255,.2); background: rgba(255,255,255,.05); color: #fff; font-size: 1rem; margin-bottom: 18px; direction: ltr; text-align: left; }
  #emailInput:focus { outline: none; border-color: #2575fc; }
  #submitBtn { width: 100%; padding: 14px; font-size: 1rem; font-weight: bold; color: #fff; background: linear-gradient(135deg, #6a11cb, #2575fc); border: none; border-radius: 12px; cursor: pointer; }

  /* Big Alert */
  .big-alert-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; width: 100%; height: 100%; background: rgba(0,0,0,.85); display: none; justify-content: center; align-items: center; z-index: 10000; padding: 20px; }
  .big-alert-overlay.show { display: flex !important; }
  .big-alert-box { background: linear-gradient(135deg, #1e3c72, #2a5298); border: 2px solid #ffd200; border-radius: 25px; padding: 40px 30px; max-width: 400px; width: 100%; text-align: center; box-shadow: 0 0 60px rgba(255, 210, 0, .6); }
  .big-alert-box .icon { font-size: 3rem; margin-bottom: 15px; }
  .big-alert-box p { font-size: 1.5rem; font-weight: bold; margin-bottom: 25px; color: #ffd200; }
  .big-alert-box button { padding: 14px 40px; font-size: 1.1rem; font-weight: bold; color: #fff; background: linear-gradient(135deg, #11998e, #38ef7d); border: none; border-radius: 50px; cursor: pointer; width: 100%; }

  .toast { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%) translateY(100px); background: #222; color: #fff; padding: 12px 25px; border-radius: 12px; border: 1px solid #38ef7d; opacity: 0; transition: all .4s ease; pointer-events: none; z-index: 10001; }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

  <div class="top-bar">
    <button id="addBtn">+ إضافة إيميل</button>
    <button id="alertBtn">تنبيه</button>
  </div>

  <div id="list">
    <p class="empty">لا توجد إيميلات بعد</p>
  </div>

  <!-- نافذة الإضافة -->
  <div id="modal" class="modal-overlay">
    <div class="modal">
      <h2>اكتب الإيميل</h2>
      <input type="email" id="emailInput" placeholder="example@mail.com">
      <button id="submitBtn">إضافة</button>
    </div>
  </div>

  <!-- تنبيه كبير (لكل المستخدمين) -->
  <div id="bigAlert" class="big-alert-overlay">
    <div class="big-alert-box">
      <div class="icon">🔔</div>
      <p id="bigAlertText">اقبل الطلب</p>
      <button id="bigAlertOk">موافق</button>
    </div>
  </div>

  <div class="toast" id="toast">تم</div>

  <!-- Supabase SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    // ننتظر تحميل الصفحة بالكامل لضمان وجود كل العناصر
    window.addEventListener('load', () => {
      // ============ بيانات مشروعك ============
      const SUPABASE_URL = 'https://ylcntstoajptlplhedsg.supabase.co';
      const SUPABASE_ANON_KEY = 'sb_publishable_Ys-DwMFKoOxxXY-f9Xktzg_VT9MhlqZ';

      // ============ عناصر DOM ============
      const modal        = document.getElementById('modal');
      const emailInput   = document.getElementById('emailInput');
      const bigAlert     = document.getElementById('bigAlert');
      const bigAlertText = document.getElementById('bigAlertText');

      // ============ Toast ============
      let toastTimer;
      function showToast(msg) {
        const t = document.getElementById('toast');
        t.textContent = msg;
        t.classList.add('show');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => t.classList.remove('show'), 2000);
      }

      // ============ نافذة الإضافة ============
      document.getElementById('addBtn').addEventListener('click', () => {
        console.log('Add button clicked'); // سجل للتأكد من عمل الزر
        modal.classList.add('show');
        emailInput.value = '';
        setTimeout(() => emailInput.focus(), 80);
      });

      modal.addEventListener('click', (e) => {
        if (e.target === modal) modal.classList.remove('show');
      });

      document.getElementById('bigAlertOk').addEventListener('click', () => {
        bigAlert.classList.remove('show');
      });

      // ============ إعداد Supabase ============
      let supabase = null;
      let alertChannel = null;
      let channelReady = false;

      try {
        if (!window.supabase || !window.supabase.createClient) {
          throw new Error('مكتبة Supabase لم تُحمّل. تأكد من اتصالك بالإنترنت.');
        }
        console.log('Initializing Supabase...');
        supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // 🛠️ الإصلاح الرئيسي: جعل القناة عامة (public) باستخدام private: false
        // وack: true لتأكيد الإرسال
        alertChannel = supabase.channel('site-alerts', {
          config: {
            broadcast: {
              self: false,   // المستخدم لا يستقبل تنبيهه الخاص
              ack: true      // تأكيد استلام الخادم للرسالة
            },
            private: false   // 🔓 قناة عامة ليتمكن أي شخص من الاستقبال
          }
        });

        alertChannel.on('broadcast', { event: 'alert' }, (payload) => {
          console.log('Broadcast received:', payload);
          const msg = (payload && payload.payload && payload.payload.message) || 'اقبل الطلب';
          bigAlertText.textContent = msg;
          bigAlert.classList.add('show');
        });

        alertChannel.subscribe((status) => {
          console.log('Realtime status:', status);
          if (status === 'SUBSCRIBED') {
            channelReady = true;
            console.log('✅ Channel ready for alerts');
          } else if (status === 'CHANNEL_ERROR') {
            console.error('❌ Channel error');
            showToast('فشل الاتصال بقناة التنبيهات');
          }
        });

      } catch (err) {
        console.error('Supabase init error:', err);
        showToast('تحذير: تعذر الاتصال بقاعدة البيانات');
      }

      // ============ تحميل القائمة ============
      async function loadEmails() {
        if (!supabase) {
          console.warn('Supabase not initialized, skipping load.');
          return;
        }
        try {
          const { data, error } = await supabase
            .from('emails')
            .select('*')
            .order('created_at', { ascending: false });

          if (error) throw error;
          renderList(data || []);
        } catch (err) {
          console.error('Load error:', err);
          showToast('خطأ في التحميل: ' + (err.message || ''));
        }
      }

      function renderList(emails) {
        const list = document.getElementById('list');
        list.innerHTML = '';
        if (!emails.length) {
          list.innerHTML = '<p class="empty">لا توجد إيميلات بعد</p>';
          return;
        }
        emails.forEach(e => {
          const row = document.createElement('div');
          row.className = 'email-row';
          row.innerHTML = `
            <div class="email-text">${escapeHtml(e.email)}</div>
            <div class="row-btns">
              <button class="copy-btn">نسخ</button>
              <button class="done-btn">تم</button>
            </div>
          `;
          row.querySelector('.copy-btn').addEventListener('click', () => copyText(e.email));
          row.querySelector('.done-btn').addEventListener('click', () => deleteEmail(e.id, row));
          list.appendChild(row);
        });
      }

      // ============ إضافة ============
      async function addEmail(email) {
        if (!supabase) { showToast('لا يوجد اتصال بقاعدة البيانات'); return false; }
        try {
          const { error } = await supabase.from('emails').insert({ email });
          if (error) throw error;
          return true;
        } catch (err) {
          console.error('Add error:', err);
          showToast('فشل الإضافة: ' + (err.message || ''));
          return false;
        }
      }

      document.getElementById('submitBtn').addEventListener('click', async () => {
        const val = emailInput.value.trim();
        if (!val) { emailInput.focus(); return; }

        const ok = await addEmail(val);
        if (ok) {
          emailInput.value = '';      // ينظف
          modal.classList.remove('show'); // يقفل
          loadEmails();               // يحدّث القائمة
        }
      });

      emailInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') document.getElementById('submitBtn').click();
      });

      // ============ حذف ============
      async function deleteEmail(id, row) {
        row.style.opacity = '0';
        row.style.transform = 'translateX(-30px)';

        setTimeout(async () => {
          if (!supabase) { row.remove(); return; }
          try {
            const { error } = await supabase.from('emails').delete().eq('id', id);
            if (error) throw error;
            row.remove();
            if (!document.querySelectorAll('.email-row').length) {
              document.getElementById('list').innerHTML = '<p class="empty">لا توجد إيميلات بعد</p>';
            }
          } catch (err) {
            console.error('Delete error:', err);
            row.style.opacity = '1';
            row.style.transform = '';
            showToast('فشل الحذف: ' + (err.message || ''));
          }
        }, 250);
      }

      // ============ نسخ ============
      async function copyText(text) {
        try {
          await navigator.clipboard.writeText(text);
          showToast('تم النسخ ✅');
        } catch {
          const ta = document.createElement('textarea');
          ta.value = text;
          document.body.appendChild(ta);
          ta.select();
          document.execCommand('copy');
          ta.remove();
          showToast('تم النسخ ✅');
        }
      }

      // ============ زر التنبيه ============
      document.getElementById('alertBtn').addEventListener('click', async () => {
        if (!alertChannel) {
          showToast('التنبيهات غير متاحة');
          return;
        }
        if (!channelReady) {
          showToast('جارٍ الاتصال... حاول مرة أخرى');
          return;
        }
        try {
          const res = await alertChannel.send({
            type: 'broadcast',
            event: 'alert',
            payload: { message: 'اقبل الطلب' }
          });
          console.log('send result:', res);
          if (res === 'ok') {
            showToast('تم إرسال التنبيه لكل المستخدمين ✅');
          } else {
            showToast('فشل الإرسال، حاول مرة أخرى');
          }
        } catch (err) {
          console.error('Send error:', err);
          showToast('فشل إرسال التنبيه');
        }
      });

      // ============ Utils ============
      function escapeHtml(s) {
        return String(s).replace(/[&<>"']/g, c => ({
          '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
        }[c]));
      }

      // ============ بدء ============
      loadEmails();
    }); // نهاية window.load
  </script>
</body>
</html>
